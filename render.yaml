# Render Blueprint: the API as a Docker web service on the free plan.
# Secrets are marked sync: false, so Render asks for them in the dashboard
# instead of reading them from this file.
services:
  - type: web
    name: amoeba-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Amoeba
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aiven's CA certificate, uploaded as a Render "Secret File" named aiven-ca.pem
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/aiven-ca.pem
      - key: SESSION_DRIVER
        value: array
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # Emails (order confirmations, password resets) are written to the log, i.e. Render's
      # log stream. To really send them, set MAIL_MAILER=smtp plus MAIL_HOST, MAIL_PORT,
      # MAIL_USERNAME, MAIL_PASSWORD and MAIL_FROM_ADDRESS from an email provider.
      - key: MAIL_MAILER
        value: log
      # Optional: an account email to make admin on each deploy (register it on the site first).
      - key: ADMIN_EMAIL
        sync: false
